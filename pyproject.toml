[project]
name = "swarmlab-formations"
version = "0.1.0"
description = "Interactive laboratory for drone swarm formation, assignment, and trajectory optimization."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dat Quoc Pham" }]
keywords = [
  "drone",
  "swarm",
  "formation",
  "assignment",
  "trajectory",
  "collision-avoidance",
  "simulation",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "plotly>=5.20",
  "pandas>=2.2",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/heoconngoc/swarmlab-formations"
Repository = "https://github.com/heoconngoc/swarmlab-formations"
Issues = "https://github.com/heoconngoc/swarmlab-formations/issues"

[project.scripts]
swarmlab-demo = "swarmlab.experiments.phase1:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swarmlab"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
